<!doctype html>
<!-- The blog's own document.

     WHY THIS FILE EXISTS AT ALL, given `index.html` already boots the app:
     because "a cold /blog load mounts no 3D" has to be a fact rather than a
     claim maintained by guards. Rewriting /blog to index.html would still run
     the intro drawing (its script is head-prepended and self-starts), still
     modulepreload three.js and the scene chunks, still preload 2.43 MB of Earth
     textures, and still mount a master timeline against a logo that never
     arrives. Each of those would need its own path check, in a different file,
     and every one of them could regress without anything noticing.

     Here, none of it is on the page. See `docs/adr/013`.

     Deliberately ABSENT compared to index.html: the intro boot script, every
     Earth/sky <link rel="preload">, and the scene modulepreloads. The
     introEntry plugin in vite.config.ts branches on the document path to keep
     it that way, and the build asserts the result. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- EVERYTHING BETWEEN THESE TWO MARKERS is replaced wholesale, per post, by
         the blogRoutes plugin in vite.config.ts, which emits
         dist/blog/<slug>/index.html from this document.

         The markers are a single deterministic anchor rather than a pattern
         over each tag. That is the difference between a build that fails
         loudly when this block is edited and one that silently emits a shell
         still carrying the generic copy — which would look completely fine and
         be worthless to every scraper that read it.

         Before that, the siteHead plugin rewrites the block with the /blog
         index's title, description and image from «Ajustes del sitio», keeping
         the markers. What is written here is the fallback the build uses when
         those fields are blank, and what the dev server shows;
         scripts/siteHead.test.ts keeps the two identical. -->
    <!--vertigo:seo:start-->
    <title>Blog — Vertigo</title>
    <meta
      name="description"
      content="Lo que aprendemos trabajando con datos reales, escrito para quien firma el presupuesto."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blog — Vertigo" />
    <meta
      property="og:description"
      content="Lo que aprendemos trabajando con datos reales, escrito para quien firma el presupuesto."
    />
    <!-- Relative only here: the build writes it against the production origin,
         because scrapers ignore a relative og:image. -->
    <meta property="og:image" content="/og-default.png" />
    <!-- Promoted from `summary`, which index.html still uses for the reason its
         own comment gives. Every post resolves an og:image at ingest
         (ogImage -> cover -> site default), so the large card can never render
         as a blank rectangle here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blog — Vertigo" />
    <meta
      name="twitter:description"
      content="Lo que aprendemos trabajando con datos reales, escrito para quien firma el presupuesto."
    />
    <!--vertigo:seo:end-->
    <meta property="og:site_name" content="Vertigo" />
    <meta property="og:locale" content="es_ES" />
    <!-- canonical and og:url are injected at build time; see seoAssets in
         vite.config.ts. -->
    <!-- Light, unlike the rest of the site. The blog deliberately inverts the
         palette, and this is what stops the browser painting a dark chrome
         around a paper-white page before the stylesheet lands. -->
    <meta name="theme-color" content="#fbfbfa" />
    <!-- The faces that render above the fold, and only those: Gambetta for the
         UI and the standfirst, General Sans for the title. The italic is left
         to `font-style`: the browser fetches it if a style on the page needs
         it, and preloading a file that is usually unused spends bytes to save
         nothing.

         `crossorigin` is required even same-origin — a font request is
         CORS-mode, and without it the preload is fetched twice. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/gambetta-variable-f705e571.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/general-sans-variable-49d3fbd2.woff2" crossorigin />
    <!-- The site's favicon, not a blog one: identical to index.html's href. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-80 -80 560 560'%3E%3Crect x='-80' y='-80' width='560' height='560' fill='%23050507'/%3E%3Cpath fill='white' d='M33.7 13.6 7.7 39.4l4.7 3.4c92.3 67.2 193 82.8 292.7 45.5 30.2-11.3 63.8-30.1 85-47.4L354.1.2l-3.4 2.3c-37.9 26-78.1 42.2-118.4 47.7-19.1 2.6-39.4 2.9-58.5.7-26.4-3-52.3-10.2-77.5-21.7C79.3 21.5 62.2 11.4 49.9 1.8L47.5 0Z'/%3E%3Cpath fill='white' d='M34.5 99.7 168.6 399.5h62.5L365 99.7l-6 2.9c-20.4 10.2-45.7 20.3-65.4 26l-2.5.9-45.5 101.1-45.4 101.2-45.6-101.1L109.1 129.3l-1.7-.3c-13.6-2.4-43.2-14.2-69.4-27.7Z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/blog.tsx"></script>
  </body>
</html>
