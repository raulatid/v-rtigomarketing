<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #06080c; color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #fff; } a:hover { color: #1c67ff; }
    p, h1, h2, h3 { margin: 0; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #3a3f46;">
  <img src="murcia.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">

  <!-- Header over a light ground -->
  <div style="position: absolute; top: 25px; right: 48px; display: flex; align-items: center; gap: 14px; height: 46px;">
    <span style="display: inline-flex; align-items: center; height: 38px; padding: 0 12px; border-radius: 10px; background: rgba(8,12,18,0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid rgba(220,230,245,0.10); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Contacto</span>
    <span style="display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; border-radius: 10px; background: #1c67ff; border: 1px solid rgba(120,160,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.28); color: #fff; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Auditoría</span>
  </div>

  <!-- Beacon · Servicios (the tower) -->
  <div style="position: absolute; left: 738px; top: 236px; width: 0; height: 0;">
    <span style="position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: rgba(120,170,255,0.95); box-shadow: 0 0 8px rgba(28,103,255,0.5);"></span>
    <span style="position: absolute; left: -0.5px; bottom: 8px; width: 1px; height: 66px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 100%);"></span>
    <div style="position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 2px; min-width: 132px; padding: 10px 14px 11px; border-radius: 10px; white-space: nowrap; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 18%), rgba(10,15,22,0.72); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); border: 1px solid rgba(220,230,245,0.10); box-shadow: 0 14px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.035);">
      <div style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 22%); opacity: 0.7;"></div>
      <span style="font-size: 0.84rem; font-weight: 600; color: rgba(255,255,255,0.94);">Servicios</span>
      <span style="font-size: 0.72rem; color: rgba(255,255,255,0.62);">Lo que hacemos</span>
    </div>
  </div>

  <!-- Beacon · Blog (the far towers) -->
  <div style="position: absolute; left: 1085px; top: 300px; width: 0; height: 0;">
    <span style="position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: rgba(120,170,255,0.95); box-shadow: 0 0 8px rgba(28,103,255,0.5);"></span>
    <span style="position: absolute; left: -0.5px; bottom: 8px; width: 1px; height: 66px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 100%);"></span>
    <div style="position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 2px; min-width: 132px; padding: 10px 14px 11px; border-radius: 10px; white-space: nowrap; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 18%), rgba(10,15,22,0.72); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); border: 1px solid rgba(220,230,245,0.10); box-shadow: 0 14px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.035);">
      <div style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 22%); opacity: 0.7;"></div>
      <span style="font-size: 0.84rem; font-weight: 600; color: rgba(255,255,255,0.94);">Blog</span>
      <span style="font-size: 0.72rem; color: rgba(255,255,255,0.62);">Lo que pensamos</span>
    </div>
  </div>

  <!-- Consent banner · density A, bottom-left, 340px. No stroke frame, no emitter; the leader stays, neutral -->
  <div style="position: absolute; left: 18px; bottom: 14px; width: 340px;">
    <span style="position: absolute; left: 0; bottom: -3px; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.7);"></span>
    <span style="position: absolute; left: 2.5px; bottom: 8px; width: 1px; height: 66px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 100%);"></span>
    <div style="position: relative; margin-bottom: 74px; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 15px; border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 18%), rgba(10,15,22,0.72); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); border: 1px solid rgba(220,230,245,0.10); box-shadow: 0 20px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.035);">
      <div style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 22%); opacity: 0.7;"></div>
      <p style="font-size: 0.84rem; font-weight: 600; color: rgba(255,255,255,0.94);">Cookies</p>
      <p style="font-size: 0.74rem; line-height: 1.5; color: rgba(255,255,255,0.62); text-wrap: pretty;">Usaremos cookies de analítica solo si lo aceptas. Hoy este sitio no instala ninguna.</p>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 16px; border-radius: 9px; background: rgba(255,255,255,0.05); border: 1px solid rgba(220,230,245,0.14); color: #fff; font-size: 0.78rem; font-weight: 500;">Rechazar</span>
        <span style="display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 16px; border-radius: 9px; background: rgba(255,255,255,0.05); border: 1px solid rgba(220,230,245,0.14); color: #fff; font-size: 0.78rem; font-weight: 500;">Aceptar</span>
        <span style="margin-left: auto; padding: 12px 2px; font-size: 0.74rem; color: rgba(255,255,255,0.62); text-decoration: underline; text-underline-offset: 0.15em;">Política de cookies</span>
      </div>
    </div>
  </div>

  <!-- Contact scrim, before / after, isolated for comparison -->
  <div style="position: absolute; right: 48px; top: 110px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end;">
    <span style="font-family: ui-monospace, Consolas, monospace; font-size: 0.7rem; color: rgba(255,255,255,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.6);">antes · píldora 999px, blur 6</span>
    <span style="display: inline-flex; align-items: center; height: 38px; padding: 0 11px; border-radius: 999px; background: rgba(12,18,26,0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Contacto</span>
    <span style="font-family: ui-monospace, Consolas, monospace; font-size: 0.7rem; color: rgba(255,255,255,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.6);">después · radio 10, borde frío, mismo blur</span>
    <span style="display: inline-flex; align-items: center; height: 38px; padding: 0 12px; border-radius: 10px; background: rgba(8,12,18,0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid rgba(220,230,245,0.10); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Contacto</span>
  </div>

</div>
</x-dc>
</body>
</html>
