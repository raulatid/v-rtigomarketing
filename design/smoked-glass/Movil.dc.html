<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #06080c; color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #fff; } a:hover { color: #1c67ff; }
    p, h1, h2, h3 { margin: 0; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #3a3f46;">
  <img src="murcia-movil.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">

  <!-- Phone header line: 12px top, 44px controls; the logo is drawn by the scene -->
  <div style="position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; background: rgba(8,12,18,0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid rgba(220,230,245,0.10); color: #fff;">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12M4 5.5h12M4 14.5h12"></path></svg>
  </div>

  <!-- The glass field, open: a smoked sheet that runs out, no emitter, a film at the line -->
  <div style="position: absolute; top: 56px; left: 0; right: 0; height: 300px; background: linear-gradient(180deg, rgba(8,12,18,0.82) 0%, rgba(8,12,18,0.72) 50%, rgba(8,12,18,0) 100%); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent 100%); mask-image: linear-gradient(180deg, #000 45%, transparent 100%);"></div>
  <span style="position: absolute; top: 56px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.18) 20%, rgba(255,255,255,0.18) 80%, rgba(255,255,255,0));"></span>

  <!-- The items -->
  <div style="position: absolute; top: 56px; left: 0; right: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 24px;">
    <span style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; background: #1c67ff; border: 1px solid rgba(120,160,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.28); color: #fff; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Auditoría</span>
    <span style="display: flex; align-items: center; height: 52px; padding-left: 12px; border-left: 2px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.85); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Contacto</span>
  </div>

  <!-- Hint frame · phone card: three columns, glyph over word over meaning -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 14px; border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 18%), rgba(10,15,22,0.74); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); border: 1px solid rgba(220,230,245,0.10); box-shadow: 0 20px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.035);">
    <div style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 22%); opacity: 0.7;"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 24H3"></path><path d="M6 21l-3 3 3 3"></path><path d="M39 24h6"></path><path d="M42 21l3 3-3 3"></path><g stroke="rgba(255,255,255,0.95)"><circle cx="24" cy="24" r="5"></circle><path d="M24 29v8"></path></g></svg>
        <span style="font-size: 0.82rem; font-weight: 500; color: rgba(255,255,255,0.92);">Arrastra</span>
        <span style="font-size: 0.68rem; line-height: 1.25; color: rgba(255,255,255,0.5);">mover</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15a16 16 0 0 1 28 0"></path><path d="M35 10l3 5-5 3"></path><g stroke="rgba(255,255,255,0.95)"><circle cx="16" cy="28" r="5"></circle><circle cx="32" cy="28" r="5"></circle></g></svg>
        <span style="font-size: 0.82rem; font-weight: 500; color: rgba(255,255,255,0.92);">Dos dedos</span>
        <span style="font-size: 0.68rem; line-height: 1.25; color: rgba(255,255,255,0.5);">girar</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="5" stroke="rgba(255,255,255,0.95)"></circle><path d="M24 29v9"></path><circle cx="24" cy="24" r="14" stroke="rgba(255,255,255,0.35)"></circle></svg>
        <span style="font-size: 0.82rem; font-weight: 500; color: rgba(255,255,255,0.92);">Toca</span>
        <span style="font-size: 0.68rem; line-height: 1.25; color: rgba(255,255,255,0.5);">un distrito iluminado</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding-top: 2px;">
      <svg viewBox="0 0 48 48" width="28" height="28" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M3 24h6"></path><path d="M6 27l3-3-3-3"></path><path d="M45 24h-6"></path><path d="M42 27l-3-3 3-3"></path><circle cx="16" cy="24" r="5" stroke="rgba(255,255,255,0.9)"></circle><circle cx="32" cy="24" r="5" stroke="rgba(255,255,255,0.9)"></circle></svg>
      <span style="font-size: 0.8rem; color: rgba(255,255,255,0.68);">Haz zoom para volver a la Tierra</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
