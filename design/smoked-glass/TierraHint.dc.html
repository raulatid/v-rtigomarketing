<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #06080c; color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #fff; } a:hover { color: #1c67ff; }
    p, h1, h2, h3 { margin: 0; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #06080c;">
  <img src="tierra.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">

  <!-- Header: the audit trigger on the new CTA recipe (solid, no glow); contact stays bare text -->
  <div style="position: absolute; top: 25px; right: 48px; display: flex; align-items: center; gap: 14px; height: 46px; padding-left: 20px; background: #000;">
    <span style="display: inline-flex; align-items: center; height: 38px; color: rgba(255,255,255,0.85); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Contacto</span>
    <span style="display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; border-radius: 10px; background: #1c67ff; border: 1px solid rgba(120,160,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.28); color: #fff; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Auditoría</span>
  </div>

  <!-- Hint frame · Earth · density A (light) -->
  <div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 13px 22px 13px 18px; border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 18%), rgba(10,15,22,0.68); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); border: 1px solid rgba(220,230,245,0.10); box-shadow: 0 20px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.035);">
    <div style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 22%); opacity: 0.7;"></div>
    <svg viewBox="0 0 24 48" width="20" height="40" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;">
      <path d="M8 8l4-4 4 4"></path>
      <rect x="7" y="14" width="10" height="20" rx="5"></rect>
      <path d="M12 18v4" stroke="rgba(255,255,255,0.95)"></path>
      <path d="M8 40l4 4 4-4"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 0.66rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.46);">Scroll</span>
      <span style="font-size: 0.92rem; font-weight: 500; line-height: 1.25; color: rgba(255,255,255,0.92); white-space: nowrap;">Haz scroll para bajar a Murcia</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
