<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #06080c; color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #fff; } a:hover { color: #1c67ff; }
    p, h1, h2, h3 { margin: 0; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #06080c;">
  <img src="tierra.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">

  <div style="position: absolute; top: 25px; right: 48px; display: flex; align-items: center; gap: 14px; height: 46px; padding-left: 20px; background: #000;">
    <span style="display: inline-flex; align-items: center; height: 38px; color: rgba(255,255,255,0.85); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Contacto</span>
    <span style="display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; border-radius: 10px; background: #1c67ff; border: 1px solid rgba(120,160,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.28); color: #fff; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Auditoría</span>
  </div>

  <!-- Scrim: unchanged -->
  <div style="position: absolute; inset: 0; background: rgba(5,5,6,0.55);"></div>

  <!-- Contact dialog · density C (heavy) · 440px -->
  <div style="position: absolute; left: 500px; top: 96px; width: 440px; height: 708px; overflow: hidden; padding: 32px 32px 26px; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 18%), rgba(7,10,15,0.86); -webkit-backdrop-filter: blur(12px) saturate(115%); backdrop-filter: blur(12px) saturate(115%); border: 1px solid rgba(220,230,245,0.10); box-shadow: 0 28px 80px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.035); box-sizing: border-box;">
    <div style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0) 22%); opacity: 0.7;"></div>

    <!-- close -->
    <span style="position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; color: rgba(255,255,255,0.62);"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></span>

    <!-- scrollbar, neutral -->
    <span style="position: absolute; top: 12px; right: 3px; bottom: 12px; width: 6px; border-radius: 999px; background: rgba(255,255,255,0.04);"><span style="position: absolute; top: 0; left: 0; width: 6px; height: 62%; border-radius: 999px; background: rgba(255,255,255,0.22);"></span></span>

    <form style="display: flex; flex-direction: column; gap: 16px;">
      <p style="font-size: 0.7rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.46); padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.35);">Hablemos</p>
      <h2 style="font-size: 1.35rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; color: rgba(255,255,255,0.94); margin: -6px 0 0; text-wrap: pretty;">Escríbenos para lo que necesites</h2>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 0.78rem; font-weight: 500; letter-spacing: 0.01em; color: rgba(255,255,255,0.68);">Nombre</label>
        <span style="display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 10px; background: rgba(4,7,11,0.55); border: 1px solid rgba(220,230,245,0.14); box-shadow: inset 0 1px 1px rgba(0,0,0,0.25); font-size: 16px; color: rgba(255,255,255,0.94);">Laura Sánchez</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 0.78rem; font-weight: 500; letter-spacing: 0.01em; color: rgba(255,255,255,0.68);">Email</label>
        <span style="display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 10px; background: rgba(6,10,15,0.65); border: 1px solid rgba(220,230,245,0.32); box-shadow: inset 0 1px 1px rgba(0,0,0,0.25), 0 0 0 3px rgba(28,103,255,0.22); font-size: 16px; color: rgba(255,255,255,0.94);">laura@</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 0.78rem; font-weight: 500; letter-spacing: 0.01em; color: rgba(255,255,255,0.68);">Mensaje</label>
        <span style="display: block; min-height: 120px; padding: 12px 14px; border-radius: 10px; background: rgba(4,7,11,0.55); border: 1px solid rgba(220,230,245,0.14); box-shadow: inset 0 1px 1px rgba(0,0,0,0.25); font-size: 16px; line-height: 1.4; color: rgba(255,255,255,0.42);">Cuéntanos qué necesitas</span>
      </div>

      <span style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 10px; background: #1c67ff; border: 1px solid rgba(120,160,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.28); color: #fff; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.01em;">Enviar <span style="opacity: 0.85;">→</span></span>

      <p style="font-size: 0.72rem; line-height: 1.5; color: rgba(255,255,255,0.46);">Al enviar aceptas los <span style="text-decoration: underline; text-underline-offset: 0.15em; color: rgba(255,255,255,0.62);">términos y privacidad</span>.</p>

      <div style="position: relative; margin-top: 8px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.06);">
        <span style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(220,230,245,0.14); color: rgba(255,255,255,0.82); font-size: 0.86rem; font-weight: 500;"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.8;"><rect x="2" y="3" width="12" height="11" rx="2"></rect><path d="M2 7h12M5 1.5v3M11 1.5v3"></path></svg>Reservar una llamada</span>
      </div>

      <div style="display: grid; grid-template-columns: 14px auto minmax(0, 1fr); column-gap: 10px; align-items: center; padding-top: 4px; font-size: 0.8rem; color: rgba(255,255,255,0.62);">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.7;"><path d="M3 2.5h2.5l1.2 3-1.6 1.2a9.5 9.5 0 0 0 4.2 4.2l1.2-1.6 3 1.2v2.5a1 1 0 0 1-1 1A11.5 11.5 0 0 1 2 3.5a1 1 0 0 1 1-1z"></path></svg>
        <span style="color: rgba(255,255,255,0.46);">Murcia:</span><span style="display: flex; align-items: center; min-height: 44px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums;">[TELÉFONO]</span>
      </div>
    </form>
  </div>

</div>
</x-dc>
</body>
</html>
