<!doctype html>
<!-- The interface copy is Spanish (see AuditSection.tsx), so the document must
     say so: a wrong lang makes screen readers apply English phonetics to
     Spanish text, and misleads search indexing. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertigo — Marketing que se mide</title>
    <meta
      name="description"
      content="Vertigo: agencia de marketing orientada a resultados. Casos reales, métricas reales y auditoría gratuita de tu presencia digital."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vertigo — Marketing que se mide" />
    <meta
      property="og:description"
      content="Casos reales, métricas reales y auditoría gratuita de tu presencia digital."
    />
    <!-- `summary`, not `summary_large_image`: there is no og:image yet, and a
         large-image card with no image renders as a blank rectangle. Claiming
         the smaller card is the honest description of what this page can
         currently offer a scraper. Promote it back to summary_large_image in
         the same change that adds the image. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vertigo — Marketing que se mide" />
    <meta
      name="twitter:description"
      content="Casos reales, métricas reales y auditoría gratuita de tu presencia digital."
    />
    <meta property="og:site_name" content="Vertigo" />
    <meta property="og:locale" content="es_ES" />
    <!-- canonical and og:url are injected at build time from the Vercel
         production domain, so a preview never declares itself canonical.
         See the seoAssets plugin in vite.config.ts. -->
    <meta name="theme-color" content="#050507" />
    <!-- Inline so it costs no request and cannot 404. Replace with the real
         brand mark when there is one. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23050507'/><path d='M20 28 L50 78 L80 28 L65 28 L50 53 L35 28 Z' fill='white'/></svg>"
    />

    <!-- Opening black, inline so it is painted on the first frame rather than
         after the stylesheet resolves. The drawing composites onto this. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050507;
      }
    </style>

    <!-- Discovery early, PRIORITY LOW (plan 007 Phase 8).
         These were plain `rel=preload`, i.e. "fetch now, high priority" — so
         2.43 MB of Earth texture competed with the 101 KB app chunk for the same
         bandwidth, and on Slow 4G spent ~12s crowding out the very JavaScript
         that would have put something on screen. They are not needed until
         after the warp, several seconds after the intro hands over.
         Starting them early is right; starting them AHEAD of the app is not. -->
    <!-- `crossorigin` is REQUIRED here, not optional, and so is `as="fetch"`.
         All three maps are KTX2, read by three's FileLoader — the same path the
         GLBs below take — and its request runs in CORS mode. A preload whose
         `as` or whose CORS mode does not match the real request is DISCARDED and
         the file downloaded a second time. Chrome logs it as an unused-preload
         warning; the Network panel shows the duplicate. (These were `as="image"`
         while the set was JPEG; the attribute tracks the loader, not the file.) -->
    <!-- `media` splits these the same way it splits the sky below, and for the
         same reason: exactly ONE set is ever fetched. The 4096x2048 trio is the
         largest single item in the texture budget on the platform least able to
         hold it; the 2048x1024 set is still oversampled at phone size.

         The 767px breakpoint MUST match `EARTH_TEXTURES.narrowMaxWidth` in
         earthConfig.ts. If the two disagree the browser preloads one set and
         the loader requests the other, and every visitor downloads both. -->
    <link
      rel="preload"
      as="fetch"
      media="(min-width: 768px)"
      crossorigin
      fetchpriority="low"
      href="/earth/day.ktx2"
    />
    <link
      rel="preload"
      as="fetch"
      media="(min-width: 768px)"
      crossorigin
      fetchpriority="low"
      href="/earth/night.ktx2"
    />
    <link
      rel="preload"
      as="fetch"
      media="(min-width: 768px)"
      crossorigin
      fetchpriority="low"
      href="/earth/clouds.ktx2"
    />
    <link
      rel="preload"
      as="fetch"
      media="(max-width: 767px)"
      crossorigin
      fetchpriority="low"
      href="/earth/day-narrow.ktx2"
    />
    <link
      rel="preload"
      as="fetch"
      media="(max-width: 767px)"
      crossorigin
      fetchpriority="low"
      href="/earth/night-narrow.ktx2"
    />
    <link
      rel="preload"
      as="fetch"
      media="(max-width: 767px)"
      crossorigin
      fetchpriority="low"
      href="/earth/clouds-narrow.ktx2"
    />
    <!-- The sky. A required boot resource — the shell stays hidden until it is
         ready, so a late arrival delays the cut, not just the scenery.

         `type` and `media` between them mean exactly ONE of these is ever
         fetched. A browser skips a preload whose `type` it cannot decode, so
         the AVIF is not downloaded by anything that would only fail on it; and
         `media` picks the resolution, so a phone never pulls the 186 KB / 33.6 MB
         desktop panorama. The WebP fallbacks are deliberately NOT preloaded:
         adding them would make modern browsers fetch both formats, which costs
         everyone bytes to save a minority a round trip. SkyShell asks for them
         only after the AVIF fails to decode.

         Keep the 767px breakpoint in step with SPACE_CONFIG.sky.narrowMaxWidth
         and the mobile breakpoint in styles.css. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 768px)"
      crossorigin
      fetchpriority="low"
      href="/textures/sky-panorama.avif"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 767px)"
      crossorigin
      fetchpriority="low"
      href="/textures/sky-panorama-narrow.avif"
    />
    <!-- Needed at the P3 crossover, which is the first beat after the intro,
         and only 20 KB — this one keeps normal priority. -->
    <link rel="preload" as="fetch" href="/models/vertigo-isotipo-3d.glb" crossorigin />
    <!-- Satellites appear in P5, well after handover. -->
    <link rel="preload" as="fetch" fetchpriority="low" href="/models/satellite.glb" crossorigin />
  </head>
  <body>
    <!-- P0's script is INJECTED into <head> by the introEntry plugin, not
         written here: Vite merges every module script in a document into one
         entry chunk, which would bundle the drawing with the app and defeat
         the point. It is a separate Rollup input. See vite.config.ts. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
